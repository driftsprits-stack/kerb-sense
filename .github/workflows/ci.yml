# CI for the Kerb Sense website. Every push and pull request runs:
# the game hash check, the writing check, lint, format, typecheck, unit tests with coverage,
# the build with the design audit, Playwright E2E with axe, a link check,
# gitleaks, npm audit and Lighthouse CI. Actions are pinned to commit SHAs.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:play
      - run: npm run check:writing
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Start the preview server for the link check and Lighthouse
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/kerb-sense/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The same lychee version as the local check. Older versions name
          # --base-url differently.
          lycheeVersion: v0.21.0
          # Site links are checked against the preview server at the same base
          # path as GitHub Pages. The canonical URLs are remapped to it, so the
          # check does not depend on the live site.
          args: >-
            --no-progress
            --base-url http://127.0.0.1:4173
            --remap "https://driftsprits-stack.github.io/kerb-sense/ http://127.0.0.1:4173/kerb-sense/"
            --exclude-path dist/play
            "dist/**/*.html"
          fail: true
      - name: Lighthouse CI
        run: npm run lhci
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
